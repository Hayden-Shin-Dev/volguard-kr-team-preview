[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "volguard-kr"
version = "0.1.0"
description = "Auditable local KRX range forecasting and intraday risk PoC"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "pyarrow>=17,<24",
  "duckdb>=1.1,<2", "scipy>=1.14,<2", "statsmodels>=0.14,<0.15",
  "lightgbm>=4.5,<5", "scikit-learn>=1.5,<2", "streamlit>=1.40,<2", "plotly>=5.24,<7",
  "httpx>=0.27,<1", "websockets>=14,<17", "python-dotenv>=1,<2",
  "joblib>=1.4,<2", "tzdata>=2024.2", "exchange-calendars>=4.13.2,<5"
]

[project.scripts]
volguard = "volguard.cli:main"

[project.optional-dependencies]
research = [
    "catboost>=1.2,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/volguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

